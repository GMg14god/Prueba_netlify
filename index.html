<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Sitio Personal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1s infinite;
    }
    .secret-dot {
      cursor: default;
      transition: color 0.2s ease;
      user-select: none;
    }
    .secret-dot:hover {
      color: #94a3b8;
    }
    .glitch-flash {
      animation: flashGlitch 0.4s ease-in-out;
    }
    @keyframes flashGlitch {
      0% { filter: invert(0); }
      50% { filter: invert(1); background: #00ff88; }
      100% { filter: invert(0); }
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-300 min-h-screen flex flex-col items-center justify-between p-6 font-mono select-none antialiased">

  <header class="w-full max-w-xl flex justify-between items-center text-xs text-neutral-600 pt-4">
    <span class="tracking-widest uppercase text-[10px]">SYS_STATUS: IDLE</span>
    <span id="clickCounterNotice" class="text-[10px] text-neutral-700 transition-opacity opacity-0 font-mono"></span>
  </header>

  <main class="w-full max-w-md text-center py-20 flex flex-col items-center">
    <div class="w-12 h-12 rounded-2xl bg-neutral-900 border border-neutral-800 flex items-center justify-center text-neutral-400 mb-8 shadow-sm">
      <svg class="w-5 h-5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
      </svg>
    </div>

    <h1 class="text-xl font-normal text-neutral-100 tracking-tight mb-2">
      Workspace
    </h1>
    
    <p class="text-neutral-500 text-sm leading-relaxed mb-6">
      Espacio privado en preparación, para mas informacion ler README en github<span id="secretTrigger" class="secret-dot text-neutral-500">.</span>
    </p>

    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-neutral-900/60 border border-neutral-800/80 text-xs text-neutral-500">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500/70"></span>
      <span>v0.1.0</span>
      <span class="text-neutral-700">|</span>
      <span>2026</span>
    </div>

    <!-- Hidden terminal prompt (shows when typing 'dev') -->
    <div id="secretTerminal" class="hidden mt-8 w-full bg-black/90 border border-neutral-800 rounded-lg p-4 text-left font-mono text-xs shadow-2xl transition-all">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-neutral-800 text-neutral-500 text-[10px]">
        <span>DEVHUB_TERMINAL_AUTH</span>
        <span class="text-emerald-400 font-bold">ACCESS GRANTED</span>
      </div>
      <p class="text-neutral-400 mb-1">> Verificando credenciales de desarrollador...</p>
      <p class="text-emerald-400 mb-2">> [OK] Abriendo caja de herramientas...</p>
      <div class="w-full bg-neutral-900 h-1.5 rounded-full overflow-hidden">
        <div id="termProgress" class="bg-emerald-400 h-full w-0 transition-all duration-700"></div>
      </div>
    </div>
  </main>

  <footer class="w-full max-w-xl flex justify-between items-center text-[11px] text-neutral-600 pb-4 border-t border-neutral-900/80 pt-4">
    <span>© 2026</span>
    <span class="text-neutral-600 flex items-center gap-1.5">
      <span class="hidden sm:inline">Presiona</span> <kbd class="px-1.5 py-0.5 rounded bg-neutral-900 border border-neutral-800 text-neutral-400 text-[10px]">dev</kbd>
    </span>
  </footer>

  <script>
    let dotClicks = 0;
    let clickTimeout;
    const secretDot = document.getElementById('secretTrigger');
    const notice = document.getElementById('clickCounterNotice');
    const terminal = document.getElementById('secretTerminal');
    const progressBar = document.getElementById('termProgress');

    // Trigger 1: Triple click on the dot (.)
    secretDot.addEventListener('click', (e) => {
      e.preventDefault();
      dotClicks++;

      clearTimeout(clickTimeout);
      clickTimeout = setTimeout(() => {
        dotClicks = 0;
        notice.classList.add('opacity-0');
      }, 1200);

      if (dotClicks === 1) {
        notice.innerText = "Secuencia 1/3...";
        notice.classList.remove('opacity-0');
      } else if (dotClicks === 2) {
        notice.innerText = "Secuencia 2/3...";
        notice.classList.remove('opacity-0');
      } else if (dotClicks >= 3) {
        notice.innerText = "Desbloqueando...";
        launchDevHub();
      }
    });

    // Trigger 2: Typing "dev" anywhere on the keyboard
    let typedKeys = "";
    window.addEventListener('keydown', (e) => {
      // Ignore modifier keys
      if (e.key.length === 1) {
        typedKeys += e.key.toLowerCase();
        if (typedKeys.length > 5) {
          typedKeys = typedKeys.slice(-5);
        }

        if (typedKeys.endsWith("dev")) {
          launchDevHub();
        }
      }

      // Quick key combo: Ctrl + Shift + K
      if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')) {
        e.preventDefault();
        launchDevHub();
      }
    });

    // Portal launcher animation
    function launchDevHub() {
      document.body.classList.add('glitch-flash');
      terminal.classList.remove('hidden');

      setTimeout(() => {
        progressBar.style.width = '100%';
      }, 50);

      setTimeout(() => {
        window.location.href = "tools.html";
      }, 850);
    }
  </script>
</body>
</html>
